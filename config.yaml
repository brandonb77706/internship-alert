# ---------------------------------------------------------------------------
# Title matching. A job is a candidate only if its title contains one of
# `include_keywords` and none of `exclude_keywords` (all case-insensitive).
# ---------------------------------------------------------------------------
include_keywords:
  - "software engineer intern"
  - "software engineering intern"
  - "software engineering internship"
  - "swe intern"
  - "software developer intern"
  - "software development intern"
  - "technology intern"
  - "software dev intern"
  - "engineering intern"     # broad; pruned by exclude_keywords below
  # Mid-market employers (regional banks, insurers, retailers, health systems)
  # rarely use the phrase "software engineer". They advertise the same work as
  # "Technology Undergraduate Intern" or "Programmer Analyst Intern", so
  # without these the whole tier gets filtered out even when we do fetch it.
  - "technology undergraduate intern"
  - "information technology intern"
  - "technology analyst intern"
  - "technical intern"
  - "tech intern"
  - "developer intern"        # Application/Web/Mobile Developer Intern
  - "development intern"
  - "programmer"              # Programmer Analyst Intern, Programmer Intern
  - "computer science intern"
  - "data engineering intern"
  - "systems engineer intern"
  - "digital technology intern"
  - "software co-op"
  - "engineering co-op"

exclude_keywords:
  # The broader include_keywords above pull in adjacent disciplines at
  # manufacturers and health systems; these prune them back out.
  - "audit"
  - "accounting"
  - "finance intern"
  - "marketing"
  - "human resources"
  - "supply chain"
  - "packaging"
  - "phd"
  - "ph.d"
  - "hardware"
  - "electrical"
  - "mechanical"
  - "asic"
  - "fpga"
  - "firmware"
  - "manufacturing"
  - "civil engineering"
  - "chemical"
  - "industrial engineering"
  - "biomedical"
  - "field engineer"
  - "sales engineer"
  - "manager"

# ---------------------------------------------------------------------------
# Fallback title rule, for employers who don't use big-tech job titles.
#
# `include_keywords` above are fixed phrases, which assumes big-tech word order
# ("Software Engineer Intern"). Regional banks and insurers often write the
# same role as "Summer 2027 Internship – Technology – Software Engineering",
# which no fixed phrase catches. This accepts any title containing BOTH an
# intern word and a tech word, in any order.
#
# Intern words are matched on word boundaries, so "Internal Auditor" and
# "International" are not mistaken for internships. exclude_keywords still
# applies on top, so it's safe to keep the tech list fairly broad.
# ---------------------------------------------------------------------------
title_pair_match:
  enabled: true
  intern_words:
    - "intern"
    - "interns"
    - "internship"
    - "internships"
    - "co-op"
    - "coop"
  tech_words:
    - "software"
    - "technology"
    - "technical"
    - "engineering"
    - "engineer"
    - "developer"
    - "development"
    - "programmer"
    - "programming"
    - "computer science"
    - "data"
    - "cyber"
    - "digital"
    - "information technology"

# ---------------------------------------------------------------------------
# Season / location filtering.
# ---------------------------------------------------------------------------
target_season_keywords:
  - "summer 2027"
  - "2027"
  - "su27"
# Jobs whose text mentions a *different* season are dropped.
reject_season_keywords:
  - "summer 2025"
  - "summer 2026"
  - "fall 2025"
  - "fall 2026"
  - "spring 2025"
  - "spring 2026"
  - "spring 2027"
  - "winter 2025"
  - "winter 2026"
  - "fall 2027"
  - "winter 2027"

# US / Remote-US location gate. A job passes if its location text matches one
# of these, is a known US city/state, or is blank (undated feeds).
location_allow:
  - "united states"
  - "usa"
  - "u.s."
  - "us"
  - "remote"

# If a job's posting date is parseable, only consider it "recent" within this
# many days when it has no explicit season. 0 = disable the recency gate.
recent_days: 30

# ---------------------------------------------------------------------------
# Email. Addresses/passwords come from environment/GitHub Secrets, NOT here.
#   GMAIL_ADDRESS, GMAIL_APP_PASSWORD, RECIPIENT_EMAIL
# ---------------------------------------------------------------------------
email:
  smtp_host: "smtp.gmail.com"
  smtp_port: 465
  # Optional override; if blank, RECIPIENT_EMAIL env var is used.
  # Multiple recipients: comma-separate them ("a@x.com, b@y.com") or use a
  # YAML list. Same applies to the RECIPIENT_EMAIL secret.
  recipient_override: ""
  # Cap the number of job cards in a single email (avoids giant emails on a
  # bad diff). Extra jobs are still recorded as seen.
  max_jobs_per_email: 60

# ---------------------------------------------------------------------------
# Slack channels to harvest job links from.
#
# Setup (all three are required, see README "Reading a Slack channel"):
#   1. Create a Slack app in the workspace, add the bot scope `channels:history`
#      (and `groups:history` for private channels), and install it.
#   2. Put the bot token (xoxb-…) in the SLACK_BOT_TOKEN secret/env var.
#   3. Invite the bot to each channel: /invite @your-bot-name
#
# Channel `id` is the C……… id, not the name — open the channel, click its name,
# and it's at the bottom of the About tab. `company_hint` is used only when the
# company can't be read off the posted link itself.
#
# Slack messages are prose, so this source is best-effort: links we can't make
# sense of are dropped rather than guessed at.
# ---------------------------------------------------------------------------
slack:
  enabled: false
  lookback_hours: 48
  max_pages_per_channel: 5
  channels: []
  # channels:
  #   - name: "internships"
  #     id: "C01ABCDEFGH"
  #     company_hint: ""

# Path to the dedupe state file (relative to repo root).
state_file: "seen_jobs.json"

# HTTP behaviour.
http:
  timeout_seconds: 25
  user_agent: "internship-alert-bot/1.0 (+github-actions)"
